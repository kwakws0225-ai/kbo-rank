# 저장 위치: (저장소 루트)/.github/workflows/kbo-respond.yml
# 텔레그램으로 '순위/이미지' 요청이 오면 최신 이미지를 답장으로 보냄
# (GitHub Actions 최소 주기인 5분 간격으로 새 메시지를 확인)

name: KBO 텔레그램 요청 응답

on:
  schedule:
    - cron: "*/5 * * * *"   # 5분마다 확인
  workflow_dispatch: {}

jobs:
  respond:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 패키지 설치
        run: pip install requests

      - name: 요청 응답 처리
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python telegram_respond.py

      - name: 처리 기록 커밋 & 푸시
        run: |
          git config user.name "kbo-bot"
          git config user.email "kbo-bot@users.noreply.github.com"
          git add data/.last_update_id || true
          git diff --cached --quiet || git commit -m "텔레그램 요청 처리 기록 $(date +'%Y-%m-%d %H:%M')"
          git push || true
